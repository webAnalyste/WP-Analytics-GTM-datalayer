name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update version in plugin file
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          sed -i "s/define( 'WADL_VERSION', '.*' );/define( 'WADL_VERSION', '$VERSION' );/" \
            wp-analytics-datalayer/wp-analytics-datalayer.php
          sed -i "s/^ \* Version:.*/ * Version:     $VERSION/" \
            wp-analytics-datalayer/wp-analytics-datalayer.php

      - name: Build plugin zip
        run: |
          zip -r wp-analytics-datalayer.zip wp-analytics-datalayer/ \
            --exclude "*.git*" \
            --exclude "*/.DS_Store" \
            --exclude "*/node_modules/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          files: wp-analytics-datalayer.zip
